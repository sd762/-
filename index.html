                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto custom-scrollbar p-2">
                                    <div>
                                        <div className="flex justify-between items-center mb-3">
                                            <div className="flex items-center gap-2">
                                                <h4 className="font-bold text-sm text-slate-700">人員名單</h4>
                                            </div>
                                            {selectedPersonnelIds.size > 0 && (
                                                <button onClick={handleBatchRemovePersonnel} className="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs font-bold border border-red-200 hover:bg-red-100 flex items-center gap-1 shadow-sm transition-all">
                                                    <IconTrash /> 批次刪除 ({selectedPersonnelIds.size})
                                                </button>
                                            )}
                                        </div>
                                        {['護理類', '照服類', '行政類'].map(cat => {
                                            const people = (personnelData[formData.unit] && personnelData[formData.unit][cat]) || [];
                                            const isExpanded = expandedFolders.has(`personnel_${cat}`);
                                            return (
                                                <div key={cat} className="mb-2">
                                                    <div className="flex items-center justify-between p-2 bg-slate-100 rounded-lg cursor-pointer hover:bg-slate-200" onClick={() => toggleFolder(`personnel_${cat}`)}>
                                                        <div className="flex items-center gap-2">
                                                            {isExpanded ? <IconChevronDown /> : <IconChevronRight />}
                                                            <IconFolder color="text-amber-500" />
                                                            <span className="font-bold text-sm text-slate-700">{cat} ({people.length})</span>
                                                        </div>
                                                        {isExpanded && people.length > 0 && (
                                                            <button
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    const catIds = people.map(name => `${cat}|${name}`);
                                                                    const allSelected = catIds.every(id => selectedPersonnelIds.has(id));
                                                                    setSelectedPersonnelIds(prev => {
                                                                        const next = new Set(prev);
                                                                        if (allSelected) catIds.forEach(id => next.delete(id));
                                                                        else catIds.forEach(id => next.add(id));
                                                                        return next;
                                                                    });
                                                                }}
                                                                className="text-[10px] bg-white border border-slate-300 hover:bg-blue-50 hover:text-blue-600 px-2 py-1 rounded text-slate-500 font-bold transition-colors shadow-sm"
                                                            >全選該類別</button>
                                                        )}
                                                    </div>
                                                    {isExpanded && (
                                                        <div className="pl-8 pr-2 py-2 space-y-1">
                                                            {people.length === 0 ? <div className="text-xs text-slate-400">尚無資料</div> : people.map((name, i) => {
                                                                const id = `${cat}|${name}`;
                                                                return (
                                                                    <div key={i} className="flex justify-between items-center p-2 hover:bg-blue-50 rounded group">
                                                                        <div className="flex items-center gap-2 w-full">
                                                                            <input
                                                                                type="checkbox"
                                                                                checked={selectedPersonnelIds.has(id)}
                                                                                onChange={() => handleTogglePersonnelSelect(id)}
                                                                                className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
                                                                            />
                                                                            <span
                                                                                className="text-sm cursor-pointer hover:text-primary font-bold w-full"
                                                                                onClick={() => {
                                                                                    const newJobTitle = cat === '護理類' ? '護理師' : (cat === '照服類' ? '照服員' : '其他');
                                                                                    setFormData(p => ({ ...p, target: name, jobTitle: newJobTitle }));
                                                                                    setShowPersonnelModal(false);
                                                                                }}
                                                                            >{name}</span>
                                                                        </div>
                                                                        <button
                                                                            onClick={() => handleRemovePersonnel(cat, name)}
                                                                            className="text-red-300 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity"
                                                                            title="移除"
                                                                        ><IconTrash /></button>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col gap-4 h-fit">
                                        <div>
                                            <h4 className="font-bold text-sm text-slate-700 mb-2">➕ 手動新增人員</h4>
                                            <div className="flex flex-col gap-2">
                                                <select id="newPersonCat" className="p-2 border rounded text-sm outline-none bg-white">
                                                    <option value="護理類">護理類</option>
                                                    <option value="照服類">照服類</option>
                                                    <option value="行政類">行政類</option>
                                                </select>
                                                <input id="newPersonName" type="text" placeholder="人員姓名" className="p-2 border rounded text-sm outline-none" />
                                                <button onClick={handleAddPersonnel} className="bg-blue-600 text-white p-2 rounded text-sm font-bold shadow hover:bg-blue-700">新增</button>
                                            </div>
                                        </div>
                                        <div className="border-t border-slate-200 pt-4">
                                            <h4 className="font-bold text-sm text-slate-700 mb-2">📥 批次匯入名單</h4>
                                            <p className="text-[10px] text-slate-500 mb-2">請準備 Excel 檔案，欄位標題需為「機構」、「職稱」與「姓名」。</p>
                                            <label className="bg-emerald-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center justify-center gap-2 cursor-pointer hover:bg-emerald-700 shadow">
                                                <IconImport /> 選擇檔案匯入
                                                <input type="file" multiple accept=".xlsx, .xls, .csv" onChange={handleImportPersonnel} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPwdModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6 border border-slate-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800">變更密碼</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">新密碼 (至少6碼)</label>
                                        <input
                                            type="password"
                                            placeholder="輸入新密碼"
                                            value={newPwd}
                                            onChange={e => setNewPwd(e.target.value)}
                                            className="w-full p-3 border border-slate-200 rounded-lg outline-none focus:border-primary transition-colors text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">確認新密碼</label>
                                        <input
                                            type="password"
                                            placeholder="再輸入一次密碼"
                                            value={confirmPwd}
                                            onChange={e => setConfirmPwd(e.target.value)}
                                            className={`w-full p-3 border rounded-lg outline-none focus:border-primary transition-colors text-sm ${confirmPwd && confirmPwd !== newPwd ? 'border-red-400 bg-red-50' : 'border-slate-200'}`}
                                        />
                                        {confirmPwd && confirmPwd !== newPwd && (
                                            <p className="text-red-500 text-xs mt-1 font-bold">✕ 兩次密碼不一致</p>
                                        )}
                                        {confirmPwd && confirmPwd === newPwd && newPwd.length >= 6 && (
                                            <p className="text-emerald-600 text-xs mt-1 font-bold">✓ 密碼符合</p>
                                        )}
                                    </div>
                                    {pwdError && <p className="text-red-500 text-xs font-bold">{pwdError}</p>}
                                    {pwdMsg && <p className="text-emerald-600 text-xs font-bold">{pwdMsg}</p>}
                                    <div className="flex gap-2 justify-end mt-2">
                                        <button onClick={() => { setShowPwdModal(false); setNewPwd(''); setConfirmPwd(''); setPwdError(''); setPwdMsg(''); }} className="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-200 transition-colors">取消</button>
                                        <button onClick={async () => {
                                            if (newPwd.length < 6) { setPwdError('密碼長度至少需要 6 碼'); return; }
                                            if (newPwd !== confirmPwd) { setPwdError('兩次密碼不一致，請重新輸入'); return; }
                                            setPwdError(''); setPwdMsg('');
                                            const { error } = await supabaseClient.auth.updateUser({ password: newPwd });
                                            if (error) setPwdError('密碼變更失敗: ' + error.message);
                                            else {
                                                setPwdMsg('✅ 密碼變更成功！即將關閉...');
                                                setTimeout(() => { setShowPwdModal(false); setNewPwd(''); setConfirmPwd(''); setPwdMsg(''); }, 1500);
                                            }
                                        }} disabled={!newPwd || !confirmPwd || newPwd !== confirmPwd || newPwd.length < 6} className="px-5 py-2.5 bg-primary text-white rounded-xl text-sm font-bold shadow hover:bg-blue-700 transition-colors disabled:opacity-40">確認變更</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {dialog.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[9999] p-4 animate-fade-in">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full">
                                <h3 className="font-bold text-lg mb-3">{dialog.title}</h3>
                                <p className="text-slate-600 mb-6 text-sm whitespace-pre-line">{dialog.message}</p>
                                <div className="flex justify-end gap-3">
                                    {dialog.type === 'confirm' && <button onClick={() => { if (dialog.onCancel) dialog.onCancel(); setDialog({ ...dialog, isOpen: false }); }} className="px-5 py-2 bg-slate-100 rounded-xl font-bold text-sm">取消</button>}
                                    <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false }); }} className={`px-5 py-2 rounded-xl font-bold text-sm text-white ${dialog.type === 'confirm' ? 'bg-red-600' : 'bg-primary'}`}>{dialog.type === 'confirm' ? '確定' : '了解'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showUnitModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[9999] p-4 animate-fade-in">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-md w-full flex flex-col max-h-[80vh]">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">🏢 增添或刪除機構</h3>
                                    <button onClick={() => setShowUnitModal(false)} className="text-slate-400 hover:text-red-500 font-bold text-2xl leading-none">&times;</button>
                                </div>
                                <div className="mb-4">
                                    <p className="text-xs text-slate-500 mb-2">您可以在此新增自訂機構名稱（例如：測試機構），新增後即可在選單中看見它。</p>
                                    <div className="flex gap-2">
                                        <input type="text" value={newCustomUnit} onChange={e => setNewCustomUnit(e.target.value)} placeholder="輸入機構名稱..." className="flex-1 p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-400 text-sm" />
                                        <button onClick={handleAddCustomUnit} disabled={!newCustomUnit.trim()} className="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 disabled:opacity-50 text-sm">
                                            新增
                                        </button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar border border-slate-100 rounded-xl">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 text-slate-600 sticky top-0">
                                            <tr>
                                                <th className="p-3 font-bold">自訂機構名稱</th>
                                                <th className="p-3 font-bold text-center w-20">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {customUnits.length === 0 ? (
                                                <tr><td colSpan="2" className="p-6 text-center text-slate-400">目前尚無自訂機構</td></tr>
                                            ) : (
                                                customUnits.map(u => (
                                                    <tr key={u} className="hover:bg-slate-50">
                                                        <td className="p-3 text-slate-800 font-bold">{u}</td>
                                                        <td className="p-3 text-center">
                                                            <button onClick={() => handleRemoveCustomUnit(u)} title="刪除機構" className="text-red-400 hover:text-red-600 p-1 bg-red-50 hover:bg-red-100 rounded">
                                                                <IconTrash />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                    <div style={{ fontSize: "10px", color: "#999", padding: "10px", textAlign: "center", borderTop: "1px dashed #eee" }}>{debugInfo || "\u6b63\u5728\u8f09\u5165\u96f2\u7aef\u8a3a\u65b7\u8cc7\u8a0a..."}</div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
