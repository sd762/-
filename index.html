    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            const errDiv = document.createElement('div');
            errDiv.style.position = 'fixed';
            errDiv.style.top = '0';
            errDiv.style.left = '0';
            errDiv.style.width = '100%';
            errDiv.style.background = 'red';
            errDiv.style.color = 'white';
            errDiv.style.zIndex = '999999';
            errDiv.style.padding = '20px';
            errDiv.innerHTML = '<h3>Global Error:</h3><p>' + msg + '</p><p>' + (error && error.stack ? error.stack : '') + '</p>';
            document.body.appendChild(errDiv);
            return false;
        };
        window.onunhandledrejection = function (event) {
            const errDiv = document.createElement('div');
            errDiv.style.position = 'fixed';
            errDiv.style.top = '0';
            errDiv.style.left = '0';
            errDiv.style.width = '100%';
            errDiv.style.background = 'orange';
            errDiv.style.color = 'white';
            errDiv.style.zIndex = '999998';
            errDiv.style.padding = '20px';
            errDiv.innerHTML = '<h3>Promise Error:</h3><p>' + (event.reason ? (event.reason.message || event.reason) : 'Unknown') + '</p>';
            document.body.appendChild(errDiv);
        };
    </script>

                        {!resetMode ? (
                            <>
                                {error && <div className="bg-red-50 text-red-500 p-3 rounded-lg text-sm mb-4 font-bold">{error}</div>}
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">電子郵件 (Email)</label>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)} required
                                            className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                            placeholder="your@email.com" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">密碼 (Password)</label>
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} required
                                            className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                            placeholder="••••••••" />
                                    </div>
                                    <button type="submit" disabled={loading}
                                        className="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl transition-all disabled:opacity-50">
                                        {loading ? '登入中...' : '登入系統'}
                                    </button>
                                </form>
                                <div className="mt-5 text-center">
                                    <button onClick={() => { setResetMode(true); setError(null); setResetMsg(''); }}
                                        className="text-sm text-blue-500 hover:text-blue-700 hover:underline transition-colors">
                                        忘記密碼？點擊重設
                                    </button>
                                </div>
                            </>
                        ) : (
                            <>
                                {resetMsg && <div className={`p-3 rounded-lg text-sm mb-4 font-bold leading-relaxed ${resetMsg.startsWith('✅') ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-500'}`}>{resetMsg}</div>}
                                <form onSubmit={handleResetPassword} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">註冊電子郵件</label>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)} required
                                            className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary transition-all"
                                            placeholder="your@email.com" />
                                    </div>
                                    <button type="submit" disabled={resetLoading}
                                        className="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl transition-all disabled:opacity-50">
                                        {resetLoading ? '發送中...' : '發送密碼重設郵件'}
                                    </button>
                                </form>
                                <div className="mt-5 text-center">
                                    <button onClick={() => { setResetMode(false); setResetMsg(''); }}
                                        className="text-sm text-slate-500 hover:text-slate-700 hover:underline transition-colors">
                                        ← 返回登入
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // --- 系統後台組件 ---
        const AdminPanel = ({ handleTemplateUpload, handleExportBackup, handleImportBackup, handleDeduplicateRecords, session }) => {
            const [customUnits, setCustomUnits] = useState([]);
            const [newCustomUnit, setNewCustomUnit] = useState('');
            useEffect(() => {
                try { setCustomUnits(JSON.parse(localStorage.getItem('custom_units_list') || '[]')); } catch (e) { }
            }, []);
            const handleAddCustomUnit = () => {
                if (!newCustomUnit.trim()) return;
                const updated = [...new Set([...customUnits, newCustomUnit.trim()])];
                setCustomUnits(updated);
                localStorage.setItem('custom_units_list', JSON.stringify(updated));
                setNewCustomUnit('');
                alert('已新增機構，請重新整理網頁生效');
            };
            const handleRemoveCustomUnit = (u) => {
                const updated = customUnits.filter(x => x !== u);
                setCustomUnits(updated);
                localStorage.setItem('custom_units_list', JSON.stringify(updated));
            };

            const [serviceKey, setServiceKey] = useState('');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [adminClient, setAdminClient] = useState(null);
            const [users, setUsers] = useState([]);
            const [loadingUsers, setLoadingUsers] = useState(false);
            const [error, setError] = useState(null);

            const [newEmail, setNewEmail] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [newUnit, setNewUnit] = useState('');
            const [creating, setCreating] = useState(false);

            // Modal for editing unit name
            const [editUnitModal, setEditUnitModal] = useState({ open: false, userId: null, userEmail: '', value: '' });

            const handleUnlock = async (e) => {
                e.preventDefault();
                setError(null);
                setLoadingUsers(true);

                try {
                    if (!serviceKey || serviceKey.length < 20) {
                        throw new Error("請輸入有效的 Service Role Key");
                    }

                    // 直接使用 fetch 測試金鑰是否有效 (獲取用戶列表)
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users`, {
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`
                        }
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.msg || errData.error || "金鑰驗證失敗");
                    }

                    const data = await response.json();
                    setUsers(data.users || []);
                    setIsAdminAuth(true);
                } catch (err) {
                    console.error("handleUnlock error:", err);
                    setError('驗證失敗：' + err.message);
                } finally {
                    setLoadingUsers(false);
                }
            };

            const fetchUsers = async () => {
                setLoadingUsers(true);
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users`, {
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`
                        }
                    });
                    const data = await response.json();
                    if (data.users) setUsers(data.users);
                } catch (err) {
                    setError('更新列表失敗');
                }
                setLoadingUsers(false);
            };

            // 刪除紀錄查察
            const [deletionLogs, setDeletionLogs] = useState([]);
            const [loadingLogs, setLoadingLogs] = useState(false);
            const [logsError, setLogsError] = useState(null);
            const [expandedLogUnits, setExpandedLogUnits] = useState({});
            const fetchDeletionLogs = async () => {
                setLoadingLogs(true);
                setLogsError(null);
                try {
                    const res = await fetch(`${supabaseUrl}/rest/v1/deletion_logs?select=*&order=deleted_at.desc&limit=5000`, {
                        headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}` }
                    });
                    if (!res.ok) {
                        const t = await res.text();
                        if (res.status === 404 || t.includes('deletion_logs')) {
                            throw new Error('找不到 deletion_logs 資料表，請先在 Supabase 建立（見系統設定說明）。');
                        }
                        throw new Error(`讀取失敗 (${res.status})`);
                    }
                    setDeletionLogs(await res.json());
                } catch (err) {
                    setLogsError(err.message || '讀取刪除紀錄失敗');
                }
                setLoadingLogs(false);
            };

            // 依機構分組刪除紀錄
            const logsByUnit = React.useMemo(() => {
                const g = {};
                deletionLogs.forEach(l => {
                    const u = l.target_unit || '未指派單位';
                    if (!g[u]) g[u] = [];
                    g[u].push(l);
                });
                return Object.keys(g).sort((a, b) => a.localeCompare(b, 'zh-TW')).reduce((acc, k) => { acc[k] = g[k]; return acc; }, {});
            }, [deletionLogs]);

            const handleCreateUser = async (e) => {
                e.preventDefault();
                setCreating(true);
                setError(null);

                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users`, {
                        method: 'POST',
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: newEmail,
                            password: newPassword,
                            email_confirm: true,
                            user_metadata: { unit: newUnit, role: 'user' }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.msg || data.error || "建立失敗");

                    setNewEmail('');
                    setNewPassword('');
                    setNewUnit('');
                    fetchUsers();
                } catch (err) {
                    setError('建立失敗：' + err.message);
                }
                setCreating(false);
            };

            const handleDeleteUser = async (userId) => {
                if (!window.confirm('確定要永久刪除此帳號嗎？\n(注意：系統將一併刪除該帳號所建立的歷史稽核紀錄與人員名單，此動作無法復原！)')) return;
                setError(null);

                try {
                    const localAdminClient = supabase.createClient(supabaseUrl, serviceKey, {
                        auth: { autoRefreshToken: false, persistSession: false }
                    });

                    // 刪除前先把該帳號的稽核紀錄寫入刪除軌跡，方便日後查核
                    try {
                        const delUser = users.find(u => u.id === userId);
                        const delEmail = delUser?.email || userId;
                        const recRes = await fetch(`${supabaseUrl}/rest/v1/audit_records?select=*&user_id=eq.${userId}`, {
                            headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}` }
                        });
                        if (recRes.ok) {
                            const delRecs = await recRes.json();
                            if (delRecs.length > 0) {
                                const logRows = delRecs.map(r => {
                                    const d = typeof r.audit_content === 'string' ? JSON.parse(r.audit_content) : (r.audit_content || {});
                                    return {
                                        operator_email: delEmail + '（刪除帳號）',
                                        action_type: '刪除帳號',
                                        target_unit: String(d.unit || '未指派單位').trim(),
                                        record_date: d.date || '',
                                        record_target: d.target || '',
                                        record_audit_name: d.auditName || '',
                                        record_score: String(d.score != null ? d.score : ''),
                                        record_id: String(r.id)
                                    };
                                });
                                await fetch(`${supabaseUrl}/rest/v1/deletion_logs`, {
                                    method: 'POST',
                                    headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                                    body: JSON.stringify(logRows)
                                });
                            }
                        }
                    } catch (logErr) { console.warn('刪除帳號軌跡寫入失敗', logErr); }

                    // 直接強制清空關聯資料，避免外鍵限制
                    const { error: err1 } = await localAdminClient.from('audit_records').delete().eq('user_id', userId);
                    if (err1) console.warn("刪除稽核紀錄失敗", err1);
                    const { error: err2 } = await localAdminClient.from('audit_personnel').delete().eq('user_id', userId);
                    if (err2) console.warn("刪除人員名單失敗", err2);

                    // 改用 REST API 直接呼叫刪除，避免瀏覽器環境被 Supabase JS 阻擋
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users/${userId}`, {
                        method: 'DELETE',
                        headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}`, 'Content-Type': 'application/json' }
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`(${response.status} ${response.statusText}) ${errText}`);
                    }
                    
                    fetchUsers();
                } catch (err) {
                    setError('刪除失敗：' + (err.message || String(err)));
                }
            };

            const openEditUnitModal = (userId, userEmail, currentUnit) => {
                setEditUnitModal({ open: true, userId, userEmail, value: currentUnit || '' });
            };

            const handleEditUnitSave = async () => {
                const { userId, value } = editUnitModal;
                const user = users.find(u => u.id === userId);
                const currentMetadata = user?.user_metadata || {};

                setLoadingUsers(true);
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users/${userId}`, {
                        method: 'PUT',
                        headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_metadata: { ...currentMetadata, unit: value.trim() } })
                    });
                    if (!response.ok) throw new Error('更新失敗');
                    setEditUnitModal({ open: false, userId: null, userEmail: '', value: '' });
                    fetchUsers();
                } catch (err) {
                    setError('修改失敗：' + err.message);
                } finally {
                    setLoadingUsers(false);
                }
            };

            const handleResetPassword = async (userId, userEmail) => {
                const newPwd = prompt(`請輸入 ${userEmail} 的新密碼 (至少6碼)：`);
                if (!newPwd || newPwd.length < 6) {
                    if (newPwd !== null) alert("密碼無效或長度不足6碼");
                    return;
                }
                setError(null);
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users/${userId}`, {
                        method: 'PUT',
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ password: newPwd })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.msg || data.error || "重置密碼失敗");
                    }
                    alert("密碼重置成功！");
                } catch (err) {
                    setError('重置密碼失敗：' + err.message);
                }
            };

            const handleEditEmail = async (userId, currentEmail) => {
                const newEmail = prompt(`請輸入新的電子郵件信箱：\n(目前信箱：${currentEmail})`, currentEmail);
                if (!newEmail || newEmail.trim() === '' || newEmail === currentEmail) return;
                
                setError(null);
                setLoadingUsers(true);
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users/${userId}`, {
                        method: 'PUT',
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email: newEmail.trim(), email_confirm: true })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.message || data.msg || data.error || "修改信箱失敗");
                    }
                    alert("信箱修改成功！");
                    fetchUsers();
                } catch (err) {
                    setError('修改信箱失敗：' + err.message);
                } finally {
                    setLoadingUsers(false);
                }
            };

            const handleFixUnits = async () => {
                if (!window.confirm('確定要根據預設名單自動修正所有帳號的所屬機構嗎？\n這將會補齊已建立但缺乏機構資訊的帳號。')) return;
                setLoadingUsers(true);
                let count = 0;
                try {
                    for (let u of users) {
                        const mappedUnit = EMAIL_TO_UNIT_MAP[u.email.toLowerCase()];
                        // 只有當該帳號完全沒有設定機構時，才自動補齊
                        if (mappedUnit && !u.user_metadata?.unit) {
                            await fetch(`${supabaseUrl}/auth/v1/admin/users/${u.id}`, {
                                method: 'PUT',
                                headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ user_metadata: { ...u.user_metadata, unit: mappedUnit } })
                            });
                            count++;
                        }
                    }
                    alert(`修正完成！共更新 ${count} 個帳號。`);
                    fetchUsers();
                } catch (err) {
                    setError('修正過程中發生錯誤：' + err.message);
                } finally {
                    setLoadingUsers(false);
                }
            };

            const [syncStatus, setSyncStatus] = useState({ loading: false, message: '' });

            const handleSyncToCloud = async () => {
                if (!window.confirm('確定要把目前這台電腦的所有資料（紀錄、題庫、名單）同步到雲端嗎？\n這會讓其他登入者也能看到這些資料。')) return;
                setSyncStatus({ loading: true, message: '同步中...' });

                try {
                    // 1. 同步人員名單（結構為 { unit: { category: [names] } }，三層）
                    const localPersonnel = Storage.getPersonnel();
                    if (localPersonnel && Object.keys(localPersonnel).length > 0) {
                        const perHeaders = {
                            'apikey': serviceKey, // 改用 serviceKey 繞過 RLS
                            'Authorization': `Bearer ${serviceKey}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        };
                        // 逐機構刪除並重新插入
                        for (const [unit, cats] of Object.entries(localPersonnel)) {
                            const encodedUnit = encodeURIComponent(unit);
                            await fetch(`${supabaseUrl}/rest/v1/audit_personnel?unit=eq.${encodedUnit}`, {
                                method: 'DELETE', headers: perHeaders
                            });
                            const rows = [];
                            Object.entries(cats || {}).forEach(([cat, names]) => {
                                (Array.isArray(names) ? names : []).forEach(name => {
                                    if (name && String(name).trim()) {
                                        // 移除 user_id，因為資料庫 API 未辨識此欄位
                                        rows.push({ unit, category: cat, name: String(name).trim() });
                                    }
                                });
                            });
                            if (rows.length > 0) {
                                await fetch(`${supabaseUrl}/rest/v1/audit_personnel`, {
                                    method: 'POST', headers: perHeaders, body: JSON.stringify(rows)
                                });
                            }
                        }
                    }

                    // 2. 同步題庫 (Templates)
                    const localTemplates = Storage.getTemplates();
                    if (localTemplates.length > 0) {
                        await fetch(`${supabaseUrl}/rest/v1/audit_templates`, {
                            method: 'POST',
                            headers: {
                                'apikey': serviceKey,
                                'Authorization': `Bearer ${serviceKey}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'resolution=merge-duplicates'
                            },
                            body: JSON.stringify(localTemplates.map(t => ({
                                id: t.id,
                                name: t.name,
                                main_category: t.mainCategory,
                                sub_category: t.subCategory,
                                target_staff: t.targetStaff,
                                responsible: t.responsible,
                                frequency: t.frequency,
                                schedule: t.schedule,
                                threshold: t.threshold,
                                is_dual: !!t.isDual,
                                items: t.items,
                                is_custom: !DEFAULT_TEMPLATES.some(dt => dt.id === t.id)
                            })))
                        });
                    }

                    // 3. 同步紀錄 (Records)
                    const localRecords = Storage.getRecords();
                    if (localRecords.length > 0) {
                        await fetch(`${supabaseUrl}/rest/v1/audit_records`, {
                            method: 'POST',
                            headers: {
                                'apikey': serviceKey,
                                'Authorization': `Bearer ${serviceKey}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(localRecords.map(r => ({
                                audit_content: {
                                    date: r.date,
                                    templateId: r.templateId,
                                    auditName: r.auditName,
                                    unitCategory: r.unitCategory,
                                    unit: String(r.unit || '').trim(),
                                    target: r.target,
                                    jobTitle: r.jobTitle,
                                    auditor: r.auditor,
                                    score: r.score,
                                    score2: r.score2,
                                    notes: r.notes,
                                    isDual: !!r.isDual,
                                    technique: r.technique,
                                    checklist: r.checklist
                                },
                                user_id: session?.user?.id || null
                            })))
                        });
                    }

                    setSyncStatus({ loading: false, message: '✅ 同步完成！所有資料已上傳至雲端。' });
                } catch (err) {
                    console.error("Sync error:", err);
                    setSyncStatus({ loading: false, message: '❌ 同步失敗：' + err.message });
                }
            };

            if (!isAdminAuth) {
                return (
                    <div className="animate-fade-in max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-red-100 mt-10">
                        <div className="flex items-center gap-3 mb-6 text-red-600">
                            <IconAdmin />
                            <h2 className="text-xl font-bold">系統後台登入</h2>
                        </div>
                        <p className="text-sm text-slate-500 mb-6">請輸入 Supabase 的 <code className="bg-slate-100 px-1 rounded">service_role</code> 金鑰以解鎖後台管理權限。此金鑰僅暫存於當前瀏覽器中。</p>

                        {error && <div className="bg-red-50 text-red-500 p-3 rounded-lg text-sm mb-4 font-bold">{error}</div>}

                        <form onSubmit={handleUnlock} className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">Service Role Key</label>
                                <input type="password" value={serviceKey} onChange={e => setServiceKey(e.target.value)} required
                                    className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-red-500 transition-all font-mono text-xs"
                                    placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />
                            </div>
                            <button type="submit" disabled={loadingUsers}
                                className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl transition-all disabled:opacity-50">
                                {loadingUsers ? '驗證中...' : '解鎖後台'}
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <>
                    <div className="animate-fade-in space-y-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center border-b pb-4 mb-4">
                                <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><IconAdmin /> 系統後台 - 帳號管理</h2>
                                <button onClick={() => setIsAdminAuth(false)} className="text-sm text-slate-500 hover:text-red-500">鎖定並登出後台</button>
                            </div>

                            {error && <div className="bg-red-50 text-red-500 p-3 rounded-lg text-sm mb-4 font-bold">{error}</div>}

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fade-in">
                                <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col gap-6">
                                    <div>
                                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">👤 新增人員帳號</h3>
                                        <form onSubmit={handleCreateUser} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">電子郵件</label>
                                                <input type="email" value={newEmail} onChange={e => setNewEmail(e.target.value)} required className="w-full p-2 rounded-lg border text-sm outline-none focus:border-blue-400" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">密碼 (至少6碼)</label>
                                                <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} required minLength={6} className="w-full p-2 rounded-lg border text-sm outline-none focus:border-blue-400" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">機構/單位</label>
                                                <select value={[...ALL_UNITS, ...customUnits].includes(newUnit) ? newUnit : (newUnit ? '__custom__' : '')} onChange={e => { if (e.target.value !== '__custom__') setNewUnit(e.target.value); }} className="w-full p-2 rounded-lg border text-sm outline-none focus:border-blue-400 bg-white mb-1">
                                                    <option value="">請選擇機構名稱</option>
                                                    {[...new Set([...ALL_UNITS, ...customUnits])].map(u => <option key={u} value={u}>{u}</option>)}
                                                    <option value="__custom__">✔ 手動輸入其他名稱...</option>
                                                </select>
                                                <input type="text" value={newUnit} onChange={e => setNewUnit(e.target.value)} placeholder="手動輸入或從上方選擇..." className="w-full p-2 rounded-lg border text-sm outline-none focus:border-blue-400" />
                                            </div>
                                            <button type="submit" disabled={creating} className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold text-sm hover:bg-blue-700 disabled:opacity-50">
                                                {creating ? '建立中...' : '建立帳號'}
                                            </button>
                                        </form>
                                    </div>

                                    <div className="pt-6 border-t border-slate-100">
                                        <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2">☁️ 雲端資料同步</h3>
                                        <p className="text-[10px] text-slate-500 mb-4 leading-relaxed">將此電腦目前的「稽核紀錄、題庫、人員名單」上傳至雲端，供所有登入者共享。</p>
                                        <button onClick={handleSyncToCloud} disabled={syncStatus.loading}
                                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm text-sm">
                                            {syncStatus.loading ? '同步中...' : <><IconImport /> 同步所有資料至雲端</>}
                                        </button>
                                        {syncStatus.message && (
                                            <p className={`mt-3 text-xs font-bold text-center ${syncStatus.message.includes('❌') ? 'text-red-500' : 'text-emerald-600'}`}>
                                                {syncStatus.message}
                                            </p>
                                        )}
                                    </div>
                                    <div className="pt-6 border-t border-slate-100">
                                        <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2">📄 匯入新表單題庫</h3>
                                        <p className="text-[10px] text-slate-500 mb-4 leading-relaxed">匯入自訂的 Excel 或 Word 檔案作為題庫，匯入後即可在現場考評中使用。</p>
                                        <label className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm text-sm cursor-pointer">
                                            <IconImport /> 點擊選擇檔案上傳<input type="file" accept=".docx, .xlsx, .xls" onChange={handleTemplateUpload} className="hidden" />
                                        </label>
                                    </div>
                                    <div className="pt-6 border-t border-slate-100">
                                        <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2">💾 資料搬家與備份</h3>
                                        <p className="text-[10px] text-slate-500 mb-4 leading-relaxed">匯出完整備份 JSON 以便日後搬家還原，或從備份檔案匯入歷史資料。</p>
                                        <div className="flex flex-col gap-2">

        const normalizeDate = (val) => {
            if (!val) return '';
            const strVal = String(val).trim();
            if (/^\d{8}$/.test(strVal)) {
                return `${strVal.substring(0, 4)}-${strVal.substring(4, 6)}-${strVal.substring(6, 8)}`;
            }
            if (/^\d{7}$/.test(strVal)) {
                return `${Number(strVal.substring(0, 3)) + 1911}-${strVal.substring(3, 5)}-${strVal.substring(5, 7)}`;
            }
            if (!isNaN(val) && Number(val) > 20000 && Number(val) < 100000) {
                const date = new Date(Math.round((Number(val) - 25569) * 86400 * 1000));
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }
            if (/^\d{4}-\d{2}-\d{2}$/.test(strVal)) return strVal;
            let str = strVal.replace(/[\/\.]/g, '-');
            const parts = str.split('-');
            if (parts.length === 3) {
                let [y, m, d] = parts;
                if (Number(y) < 1000) y = String(Number(y) + 1911);
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return strVal;
        };

            useEffect(() => { Storage.saveRecords(records); }, [records]);
            useEffect(() => { Storage.saveTemplates(templates); }, [templates]);
            useEffect(() => { Storage.saveSettings(reportSettings); }, [reportSettings]);
            useEffect(() => {
                Storage.savePersonnel(personnelData);
                // 僅在初次雲端載入完成後才觸發寫回，避免登入時用本地舊資料覆蓋雲端

                    syncPersonnelToCloud(personnelData);

            }, [personnelData]);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (targetInputRef.current && !targetInputRef.current.closest('.relative').contains(e.target)) {
                        setShowPersonnelDropdown(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            useEffect(() => {
                if (checklist.length > 0) {
                    if (formData.isDual) {
                        const total = checklist.length;
                        const washedCount = checklist.filter(i => i.comp === 'dry' || i.comp === 'wet').length;
                        const correctCount = checklist.filter(i => (i.comp === 'dry' || i.comp === 'wet') && i.acc === 'yes').length;
                        setFormData(p => ({ ...p, score: total > 0 ? Math.round((washedCount / total) * 100) : 0, score2: washedCount > 0 ? Math.round((correctCount / washedCount) * 100) : 0 }));
                    } else {
                        const validItems = checklist.filter(i => i.score !== '');
                        const totalMax = validItems.reduce((a, c) => a + c.maxScore, 0);
                        const totalCur = validItems.reduce((a, c) => a + Number(c.score || 0), 0);
                        setFormData(p => ({ ...p, score: totalMax > 0 ? Math.round((totalCur / totalMax) * 100) : 0 }));
                    }
                }
            }, [checklist, formData.isDual]);

            const handleAddPersonnel = () => {
                const cat = document.getElementById('newPersonCat').value;
                const name = document.getElementById('newPersonName').value.trim();
                if (!name) return showAlert('請輸入人員姓名！');

                const unitData = personnelData[formData.unit] || { '護理類': [], '照服類': [], '行政類': [] };
                const allNamesInUnit = Object.values(unitData).flat();

                if (allNamesInUnit.includes(name)) {
                    showConfirm(`機構內已有名為「${name}」的人員。是否要重複新增並自動編號？`, () => {
                        const uniqueName = getUniqueName(unitData, name);
                        setPersonnelData(prev => {
                            const uData = prev[formData.unit] || { '護理類': [], '照服類': [], '行政類': [] };
                            const newCat = uData[cat] ? [...uData[cat]] : [];
                            newCat.push(uniqueName);
                            return { ...prev, [formData.unit]: { ...uData, [cat]: newCat } };
                        });
                        document.getElementById('newPersonName').value = '';
                        showAlert(`已新增為：${uniqueName}`);
                    });
                } else {
                    setPersonnelData(prev => {
                        const uData = prev[formData.unit] || { '護理類': [], '照服類': [], '行政類': [] };
                        const newCat = uData[cat] ? [...uData[cat]] : [];
                        newCat.push(name);
                        return { ...prev, [formData.unit]: { ...uData, [cat]: newCat } };
                    });
                    document.getElementById('newPersonName').value = '';
                    showAlert(`已將 ${name} 加入 ${cat}`);
                }
            };

            const handleRemovePersonnel = (cat, name) => {
                showConfirm(`確定要從 ${cat} 移除 ${name}？`, () => {
                    setPersonnelData(prev => {
                        const unitData = prev[formData.unit] || {};
                        const newCat = (unitData[cat] || []).filter(n => n !== name);
                        return { ...prev, [formData.unit]: { ...unitData, [cat]: newCat } };
                    });
                });
            };

            const handleBatchRemovePersonnel = () => {
                if (selectedPersonnelIds.size === 0) return showAlert('請先勾選要刪除的人員！');
                showConfirm(`確定要刪除選取的 ${selectedPersonnelIds.size} 位人員？`, () => {
                    setPersonnelData(prev => {
                        const newData = { ...prev };
                        const unitData = newData[formData.unit] || {};
                        const toRemove = Array.from(selectedPersonnelIds).map(id => id.split('|'));
                        toRemove.forEach(([cat, name]) => {
                            if (unitData[cat]) {
                                unitData[cat] = unitData[cat].filter(n => n !== name);
                            }
                        });
                        newData[formData.unit] = unitData;
                        return newData;
                    });
                    setSelectedPersonnelIds(new Set());

            };

            const handleTogglePersonnelSelect = (id) => {
                setSelectedPersonnelIds(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id); else next.add(id);
                    return next;
                });
            };

            const handleImportPersonnel = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                let successFiles = 0;
                let failFiles = 0;
                const rawRows = [];

                for (let file of files) {
                    try {
                        const buffer = await file.arrayBuffer();
                        const wb = window.XLSX.read(new Uint8Array(buffer), { type: 'array' });
                        wb.SheetNames.forEach(sheetName => {
                            const data = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
                            data.forEach(row => rawRows.push({ ...row, _sheetName: String(sheetName).trim() }));
                        });
                        successFiles++;
                    } catch (err) { failFiles++; }
                }

                // 預處理名單
                const itemsToAdd = [];
                rawRows.forEach(row => {
                    const name = String(row['姓名'] || row['人員姓名'] || row['Name'] || '').trim();
                    if (!name || name === 'undefined') return;

                    let rawUnit = String(row['機構'] || row['單位'] || row['受稽單位'] || '').trim();
                    if (!rawUnit && row._sheetName) rawUnit = row._sheetName;

                    let cat = String(row['職稱'] || row['職務類別'] || row['類別'] || row['職務'] || row['Category'] || '').trim();
                    let targetUnit = formData.unit;
                    if (rawUnit) {
                        if (rawUnit === '一館' || rawUnit.includes('一館')) targetUnit = '清福一館';
                        else if (rawUnit === '二館' || rawUnit.includes('二館')) targetUnit = '清福二館';
                        else if (rawUnit === '三館' || rawUnit.includes('三館')) targetUnit = '清福三館';
                        else if (rawUnit.includes('護理之家')) targetUnit = '清福護理之家';
                        else targetUnit = rawUnit;
                    }

                    if (!['護理類', '照服類', '行政類'].includes(cat)) {
                        if (cat.includes('護理') || cat.includes('護士')) cat = '護理類';
                        else if (cat.includes('照顧服務員') || cat.includes('照服') || cat.includes('保母')) cat = '照服類';
                        else cat = '行政類';
                    }

                    if (!canViewAll) {
                        if (targetUnit && targetUnit !== userUnit) return;
                        targetUnit = userUnit;
                    }
                    if (!targetUnit) targetUnit = '未指派單位';

                    itemsToAdd.push({ unit: targetUnit, cat, name });
                });

                const unitGroups = {};
                itemsToAdd.forEach(item => {
                    if (!unitGroups[item.unit]) unitGroups[item.unit] = [];
                    unitGroups[item.unit].push(item);
                });

                const finalItemsToAdd = [];
                for (const [u, items] of Object.entries(unitGroups)) {
                    if (canViewAll) {
                        if (window.confirm(`是否確定將 ${items.length} 筆人員名單導入「${u}」？\n(確定後才會導入該機構)`)) {
                            finalItemsToAdd.push(...items);
                        }
                    } else {
                        if (u === userUnit) finalItemsToAdd.push(...items);
                    }
                }

                if (finalItemsToAdd.length === 0) {
                    showAlert('沒有任何名單被匯入。');
                    e.target.value = '';
                    return;
                }

                // 檢查重複
                let hasDup = false;
                const tempState = {}; // unit -> Set(names)
                Object.keys(personnelData).forEach(u => {
                    tempState[u] = new Set(Object.values(personnelData[u]).flat());
                });

                for (let item of finalItemsToAdd) {
                    if (!tempState[item.unit]) tempState[item.unit] = new Set();
                    if (tempState[item.unit].has(item.name)) { hasDup = true; break; }
                    tempState[item.unit].add(item.name);
                }

                const process = (allowDup) => {
                    let count = 0;
                    setPersonnelData(prev => {
                        const newData = { ...prev };
                        finalItemsToAdd.forEach(item => {
                            if (!newData[item.unit]) newData[item.unit] = { '護理類': [], '照服類': [], '行政類': [] };
                            const allNames = Object.values(newData[item.unit]).flat();

                            if (allNames.includes(item.name)) {
                                if (allowDup) {
                                    const unique = getUniqueName(newData[item.unit], item.name);
                                    newData[item.unit][item.cat].push(unique);
                                    count++;
                                }
                            } else {
                                newData[item.unit][item.cat].push(item.name);
                                count++;
                            }
                        });
                        return newData;
                    });
                    let msg = `✅ 成功匯入 ${count} 筆人員資料 (來自 ${successFiles} 個檔案)！`;
                    if (failFiles > 0) msg += `\n❌ 失敗 ${failFiles} 個檔案。`;
                    showAlert(msg);
                    e.target.value = '';
                };

                if (hasDup) {
                    showConfirm('偵測到同名人員 (機構內已存在或名單重複)。是否要自動在姓名後方標示 1、2... 並全部匯入？\n\n點選「取消」則會略過重複姓名。', () => process(true), '⚠️ 偵測到重複姓名', () => process(false));
                } else {
                    process(false);
                }
            };

            const buildTableData = useCallback((categoryName) => {
                const hiddenItems = reportSettings.hiddenItems || [];
                const manualScores = reportSettings.manualScores || {};
                const analysisTexts = reportSettings.analysisTexts || {};
                const customFreqs = reportSettings.customFrequencies || {};

                const allItems = templates.filter(t => t.mainCategory === categoryName).map(tpl => {
                    const yearRecords = records.filter(r => {
                        const uCat = r.unitCategory || getUnitCategory(r.unit);
                        return String(r.date).startsWith(selectedYear) &&
                            r.auditName.includes(tpl.name) &&
                            (filterUnit ? (String(r.unit || '').trim().includes(String(filterUnit || '').trim()) || String(filterUnit || '').trim().includes(String(r.unit || '').trim())) : (filterUnitCategory ? uCat === filterUnitCategory : true));
                    });
                    const mAvgs = Array(13).fill(null).map(() => ({ val: '', count: 0, manual: false }));
                    let sum = 0, sum2 = 0, count = 0;
                    if (tpl.isDual) {
                        const monthsC = Array(13).fill(0), monthsA = Array(13).fill(0), monthsCnt = Array(13).fill(0);
                        yearRecords.forEach(r => {
                            const m = parseInt(r.date.split('-')[1]);
                            if (m) { monthsC[m] += Number(r.score || 0); monthsA[m] += Number(r.score2 || 0); monthsCnt[m]++; }
                        });
                        for (let m = 1; m <= 12; m++) {
                            const key = `${selectedYear}_${tpl.id}_${m}`;
                            if (manualScores[key]) {
                                mAvgs[m] = { val: manualScores[key], count: 0, manual: true };
                                const p = manualScores[key].split('/');
                                if (p[1]) { sum += Number(p[0]); sum2 += Number(p[1]); count++; }
                            }
                            else if (monthsCnt[m] > 0) {
                                const c = Math.round((monthsC[m] / monthsCnt[m]) * 10) / 10, a = Math.round((monthsA[m] / monthsCnt[m]) * 10) / 10;
                                mAvgs[m] = { val: `${c}/${a}`, count: monthsCnt[m], manual: false };
                                sum += c;
                                sum2 += a;
                                count++;
                            }
                        }
                    } else {
                        const monthsS = Array(13).fill(0), monthsCnt = Array(13).fill(0);
                        yearRecords.forEach(r => { const m = parseInt(r.date.split('-')[1]); if (m) { monthsS[m] += Number(r.score); monthsCnt[m]++; } });
                        for (let m = 1; m <= 12; m++) {
                            const key = `${selectedYear}_${tpl.id}_${m}`;
                            if (manualScores[key]) { const v = Number(manualScores[key]); mAvgs[m] = { val: v, count: 0, manual: true }; sum += v; count++; }
                            else if (monthsCnt[m] > 0) { const v = Math.round((monthsS[m] / monthsCnt[m]) * 10) / 10; mAvgs[m] = { val: v, count: monthsCnt[m], manual: false }; sum += v; count++; }
                        }
                    }
                    const avgStr = count > 0 ? (tpl.isDual ? `${Math.round((sum / count) * 10) / 10}/${Math.round((sum2 / count) * 10) / 10}` : Math.round((sum / count) * 10) / 10) : '-';
                    const customThresholds = reportSettings.customThresholds || {};
                    const itemThreshold = customThresholds[tpl.id] !== undefined ? Number(customThresholds[tpl.id]) : (tpl.threshold || 90);

                    // 自動產出分析文字
                    const generateAutoAnalysis = () => {
                        if (count === 0) return '';
                        const itemName = tpl.name;
                        let text = '';

                        if (tpl.isDual) {
                            const avgComp = Math.round(sum / count);
                            const avgAcc = Math.round(sum2 / count);
                            const belowMonths = [];
                            for (let m = 1; m <= 12; m++) {
                                if (mAvgs[m].val !== '') {
                                    const parts = String(mAvgs[m].val).split('/');
                                    if (parts.length === 2 && (Number(parts[0]) < itemThreshold || Number(parts[1]) < itemThreshold)) {
                                        belowMonths.push({ month: m, comp: Number(parts[0]), acc: Number(parts[1]) });
                                    }
                                }
                            }
                            if (avgComp >= itemThreshold && avgAcc >= itemThreshold && belowMonths.length === 0) {
                                text = `${itemName}年度平均遵從率${avgComp}%、正確率${avgAcc}%，均達閾值${itemThreshold}%以上。建議持續維持現有監測機制。`;
                            } else {
                                text = `${itemName}年度平均遵從率${avgComp}%、正確率${avgAcc}%(閾值${itemThreshold}%)。`;
                                if (belowMonths.length > 0) {
                                    text += `未達標月份：${belowMonths.map(b => `${b.month}月(${b.comp}/${b.acc})`).join('、')}。`;
                                }
                                if (avgComp < itemThreshold) text += '遵從率不足，建議加強洗手時機宣導。';
                                if (avgAcc < itemThreshold) text += '正確率偏低，需加強洗手步驟訓練。';
                            }
                        } else {
                            const avgScore = Math.round(sum / count);
                            const belowMonths = [];
                            const scoreValues = [];
                            for (let m = 1; m <= 12; m++) {
                                if (mAvgs[m].val !== '') {
                                    const v = Number(mAvgs[m].val);
                                    scoreValues.push({ month: m, val: v });
                                    if (v < itemThreshold) belowMonths.push({ month: m, val: v });
                                }
                            }
                            // 趨勢分析 (2筆以上才比較趨勢)
                            let trend = '';
                            if (scoreValues.length >= 2) {
                                const firstHalf = scoreValues.slice(0, Math.floor(scoreValues.length / 2));
                                const secondHalf = scoreValues.slice(Math.floor(scoreValues.length / 2));
                                const firstAvg = firstHalf.reduce((a, c) => a + c.val, 0) / firstHalf.length;
                                const secondAvg = secondHalf.reduce((a, c) => a + c.val, 0) / secondHalf.length;
                                if (secondAvg - firstAvg >= 5) trend = '呈上升趨勢';
                                else if (firstAvg - secondAvg >= 5) trend = '呈下降趨勢，需注意';
                                else trend = '表現穩定';
                            }

                            // 單次測驗 vs 多次測驗 用不同措辭
                            const isSingle = scoreValues.length === 1;

                            if (avgScore >= itemThreshold && belowMonths.length === 0) {
                                if (isSingle) {
                                    text = `${itemName}本年度${scoreValues[0].month}月測驗成績${avgScore}%，達標(閾值${itemThreshold}%)。建議持續維持現有考核標準。`;
                                } else {
                                    text = `${itemName}年度平均${avgScore}%，全年達標(閾值${itemThreshold}%)。`;
                                    if (trend) text += `整體${trend}。`;
                                    text += '建議持續維持現有考核標準與監測頻率。';
                                }
                            } else if (avgScore >= itemThreshold && belowMonths.length > 0) {
                                text = `${itemName}年度平均${avgScore}%達標，但${belowMonths.map(b => `${b.month}月(${b.val}%)`).join('、')}低於閾值${itemThreshold}%。`;
                                if (trend) text += `整體${trend}。`;
                                text += '建議針對未達標月份檢討原因，加強人員複訓。';
                            } else {
                                if (isSingle) {
                                    text = `⚠ ${itemName}本年度${scoreValues[0].month}月測驗成績${avgScore}%，未達閾值${itemThreshold}%。`;
                                } else {
                                    text = `⚠ ${itemName}年度平均${avgScore}%，未達閾值${itemThreshold}%。`;
                                    if (belowMonths.length > 0) {
                                        text += `未達標月份：${belowMonths.map(b => `${b.month}月(${b.val}%)`).join('、')}。`;
                                    }
                                    if (trend) text += `整體${trend}。`;
                                }
                                text += '建議：1.安排全員複訓 2.增加稽核頻率 3.檢討操作流程並落實改善。';
                            }
                        }
                        return text;
                    };

                    return { id: tpl.id, itemName: tpl.name, targetStaff: tpl.targetStaff || '-', responsible: tpl.responsible || '-', frequency: customFreqs[tpl.id] || tpl.frequency, schedule: (reportSettings.customSchedules && reportSettings.customSchedules[`${selectedYear}_${tpl.id}`]) || tpl.schedule || [], threshold: itemThreshold, isDual: !!tpl.isDual, mAvgs, avg: avgStr, analysisText: analysisTexts[`${selectedYear}_${tpl.id}`] || '', autoAnalysisText: generateAutoAnalysis(), isHidden: hiddenItems.includes(tpl.id) };
                });
                return { visible: allItems.filter(i => !i.isHidden), hidden: allItems.filter(i => i.isHidden) };
            }, [records, selectedYear, templates, reportSettings, filterUnitCategory, filterUnit]);

            const careReportData = useMemo(() => buildTableData('照護品質類技術考'), [buildTableData]);
            const equipReportData = useMemo(() => buildTableData('儀器操作類技術考'), [buildTableData]);

            // === 恢復遺失的變數與函數 ===
            const flatFilteredRecords = useMemo(() => {
                return records.filter(r => {
                    const uCat = r.unitCategory || getUnitCategory(r.unit);
                    const normalize = (s) => String(s || '').replace(/[^\u4e00-\u9fa5]/g, '');
                    const rUnitNorm = normalize(r.unit);
                    const fUnitNorm = normalize(filterUnit);
                    return (filterMonth ? String(r.date).startsWith(filterMonth) : true) &&
                        (filterItem ? r.auditName === filterItem : true) &&
                        (filterUnit ? (rUnitNorm.includes(fUnitNorm) || fUnitNorm.includes(rUnitNorm)) : (filterUnitCategory ? uCat === filterUnitCategory : true));
                });
            }, [records, filterMonth, filterItem, filterUnitCategory, filterUnit]);

            const parseAuditName = (name) => {
                const match = String(name || '').match(/^(.*?)\s*[（(]\s*(.+?)\s*[)）]\s*$/);
                if (match && match[1].trim()) return { base: match[1].trim(), sub: match[2].trim() };
                return { base: String(name || '未命名'), sub: '' };
            };

            const groupedRecords = useMemo(() => {
                const groups = {};
                flatFilteredRecords.forEach(r => {
                    const u = r.unit || '未指派單位';
                    const m = String(r.date).substring(0, 7) || '未知';
                    const { base, sub } = parseAuditName(r.auditName);

                    if (!groups[u]) groups[u] = { months: {}, totalCount: 0 };
                    if (!groups[u].months[m]) groups[u].months[m] = { items: {}, totalCount: 0 };
                    if (!groups[u].months[m].items[base]) groups[u].months[m].items[base] = { subs: {}, count: 0 };
                    if (!groups[u].months[m].items[base].subs[sub]) groups[u].months[m].items[base].subs[sub] = [];

                    groups[u].months[m].items[base].subs[sub].push(r);
                    groups[u].months[m].items[base].count++;
                    groups[u].months[m].totalCount++;
                    groups[u].totalCount++;
                });
                return Object.keys(groups).sort().reduce((acc, uKey) => {
                    const unitData = groups[uKey];
                    unitData.months = Object.keys(unitData.months).sort().reverse().reduce((mAcc, mKey) => {
                        mAcc[mKey] = unitData.months[mKey]; return mAcc;
                    }, {});
                    acc[uKey] = unitData;
                    return acc;
                }, {});
            }, [flatFilteredRecords]);

            const uniqueMonths = useMemo(() => [...new Set(records.map(r => String(r.date).substring(0, 7)))].sort().reverse(), [records]);
            const uniqueItems = useMemo(() => [...new Set(records.map(r => r.auditName))].sort(), [records]);

            const toggleFolder = (folderId) => {
                setExpandedFolders(prev => {
                    const next = new Set(prev);
                    if (next.has(folderId)) next.delete(folderId); else next.add(folderId);
                    return next;
                });
            };

            const sortRecords = (recs) => [...recs].sort((a, b) => {
                if (historySortBy === 'date_desc') return b.date.localeCompare(a.date);
                if (historySortBy === 'date_asc') return a.date.localeCompare(b.date);
                if (historySortBy === 'name_asc') return (a.target || '').localeCompare(b.target || '', 'zh-TW');
                if (historySortBy === 'name_desc') return (b.target || '').localeCompare(a.target || '', 'zh-TW');
                if (historySortBy === 'job_asc') return (a.jobTitle || '').localeCompare(b.jobTitle || '', 'zh-TW');
                if (historySortBy === 'job_desc') return (b.jobTitle || '').localeCompare(a.jobTitle || '', 'zh-TW');
                return 0;
            });

            const renderRecordRow = (r, padClass) => (
                <tr key={r.id} className={`hover:bg-blue-50/40 transition-colors ${selectedIds.has(r.id) ? 'bg-blue-50/60' : ''}`}>
                    <td className="p-3 text-center"><input type="checkbox" checked={selectedIds.has(r.id)} onChange={() => handleToggleSelect(r.id)} className="w-4 h-4 cursor-pointer" /></td>
                    <td className={`p-3 text-slate-500 ${padClass || 'pl-24'}`}>{r.date}</td><td className="p-3 font-black text-primary">{r.target} {r.jobTitle && <span className="text-[9px] bg-slate-100 text-slate-500 px-1 py-0.5 rounded ml-1 font-normal">{r.jobTitle}</span>}</td><td className="p-3 text-slate-600 truncate max-w-[150px]">{r.auditName}</td>
                    <td className="p-3 text-center">
                        {r.isDual ? (
                            <span className="inline-flex gap-1 text-[10px] font-black"><span className="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">遵:{r.score}%</span><span className="bg-teal-100 text-teal-700 px-1.5 py-0.5 rounded">正:{r.score2}%</span></span>
                        ) : (
                            <span className={`inline-block px-2 py-1 rounded-full font-black ${r.score < 80 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700'}`}>{r.score}</span>
                        )}
                    </td>
                    <td className="p-3 text-center"><button onClick={() => handleDeleteSingle(r.id)} className="text-red-300 hover:text-red-600 transition-colors"><IconTrash /></button></td>
                </tr>
            );

                        const wb = window.XLSX.read(new Uint8Array(buffer), { type: 'array' });

                        wb.SheetNames.forEach(sheetName => {
                            const aoa = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
                            if (!aoa || aoa.length === 0) return;

                            let headerRowIdx = -1;
                            for (let i = 0; i < Math.min(10, aoa.length); i++) {
                                const rowStr = aoa[i].join('');
                                if (rowStr.includes('稽核日期') || rowStr.includes('日期')) {
                                    headerRowIdx = i;
                                    break;
                                }
                            }

                            let data = [];
                            if (headerRowIdx !== -1) {
                                const headers = aoa[headerRowIdx];
                                for (let i = headerRowIdx + 1; i < aoa.length; i++) {
                                    const rowData = {};
                                    headers.forEach((h, colIdx) => {
                                        if (h) rowData[h] = aoa[i][colIdx];
                                    });
                                    data.push(rowData);
                                }
                            } else {
                                data = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { raw: true, defval: '' });
                            }

                            const validData = data.filter(row => row['稽核人員'] !== '平均總分' && (row['稽核日期'] || row['日期']) && !String(row['稽核日期'] || row['日期']).includes('覆核者'));

                            const imported = validData.map((row, index) => {
                                const rawAuditName = String(row['稽核項目'] || row['項目'] || '');
                                const isDualItem = rawAuditName.includes('洗手遵從性及正確性');

                                let finalAuditName = rawAuditName;
                                if (!isDualItem) {
                                    const cleanRaw = rawAuditName.replace(/[\d\sA-Za-z.-]/g, '');
                                    if (cleanRaw.includes('鼻胃管灌食')) finalAuditName = '鼻胃管灌食評核標準';
                                    else if (cleanRaw.includes('備餐餵食') || cleanRaw.includes('備餐')) finalAuditName = '備餐餵食評核標準';
                                    else if (cleanRaw.includes('保護性約束') || cleanRaw.includes('約束')) finalAuditName = '保護性約束評核表';
                                    else if (cleanRaw.includes('鼻胃管置入')) finalAuditName = '鼻胃管置入評核總表';
                                    else if (cleanRaw.includes('導尿管置入') || cleanRaw.includes('導尿管')) finalAuditName = '導尿管置入評核表';
                                    else if (cleanRaw.includes('胰島素注射') || cleanRaw.includes('胰島素')) finalAuditName = '胰島素注射評核總表';
                                    else if (cleanRaw.includes('抽痰技術') || cleanRaw.includes('抽痰')) finalAuditName = '抽痰技術評核表';
                                    else if (cleanRaw.includes('傷口評估') || cleanRaw.includes('換藥')) finalAuditName = '傷口評估換藥護理評核表';
                                    else if (cleanRaw.includes('氣切造口') || cleanRaw.includes('氣切')) finalAuditName = '氣切造口護理技術評核表';
                                    else if (cleanRaw.includes('造口護理')) finalAuditName = '造口護理技術評核表';
                                    else if (cleanRaw.includes('給藥及藥單') || cleanRaw.includes('給藥')) finalAuditName = '給藥及藥單書寫評核標準';
                                    else if (cleanRaw.includes('昏迷指數') || cleanRaw.includes('GCS')) finalAuditName = '昏迷指數(GCS)評核表';
                                    else if (cleanRaw.includes('翻身拍背') || cleanRaw.includes('翻身')) finalAuditName = '翻身拍背擺位評核標準';

                                    else if (cleanRaw.includes('口腔清潔') || cleanRaw.includes('口腔')) finalAuditName = '口腔清潔評核標準';
                                    else {
                                        const stripTerms = (n) => n.replace(/(評核標準|評核表|評分標準|評核總表|操作技術|護理技術|技術)/g, '');
                                        for (let tpl of templates) {
                                            const coreName = stripTerms(tpl.name);
                                            if (coreName.length >= 2 && cleanRaw.includes(coreName)) {
                                                finalAuditName = tpl.name;
                                                break;
                                            }
                                        }
                                    }
                                }

                                const checklist = [];
                                if (!isDualItem) {
                                    let template = templates.find(t => t.name === finalAuditName);
                                    const itemKeys = Object.keys(row).filter(k => /^項\d+_/.test(k));
                                    itemKeys.sort((a, b) => parseInt(a.match(/^項(\d+)_/)[1], 10) - parseInt(b.match(/^項(\d+)_/)[1], 10));

                                    itemKeys.forEach((key, idx) => {
                                        const name = key.substring(key.indexOf('_') + 1);
                                        const itemScore = row[key];
                                        const numScore = itemScore === '' || itemScore === undefined ? 0 : Number(itemScore);

                                        let maxScore = numScore;
                                        let mode = 'partial';

                                        if (template && template.items && template.items[idx] && template.items[idx].name === name) {
                                            maxScore = template.items[idx].maxScore;
                                            if (numScore === maxScore) mode = 'full';
                                            else if (numScore === 0) mode = 'zero';
                                        }

                                        checklist.push({
                                            id: Math.random().toString(36).substr(2, 9),
                                            name: name,
                                            score: numScore,
                                            maxScore: maxScore > 0 ? maxScore : 100, // prevent 0 maxScore
                                            note: '',
                                            mode: mode
                                        });
                                    });
                                }

                                const parsedUnit = String(row['受稽單位'] || row['單位'] || '').trim();
                                let finalUnit = '';
                                if (targetUnit && targetUnit !== 'AUTO') {

                                    finalUnit = parsedUnit || '未指派單位';

                                    isDual: isDualItem, notes: String(row['總結建議'] || ''), checklist: checklist
                                };
                            });

                            let filteredImported = [];
                            const unitGroups = {};
                            imported.forEach(r => {
                                if (!unitGroups[r.unit]) unitGroups[r.unit] = [];
                                unitGroups[r.unit].push(r);
                            });

                            for (const [u, records] of Object.entries(unitGroups)) {

                                        filteredImported.push(...records);
                                    }
                                } else {

                                            filteredImported.push(...records);
                                        }
                                    } else {
                                        filteredImported.push(...records);
                                    }
                                }
                            }

                            allImported = allImported.concat(filteredImported);
                        });
                        successFiles++;
                    } catch (err) {
                        failFiles++;
                    }
                }

                // 重複過濾：同機構 + 同月份 + 同稽核項目 + 同受測者 → 跳過
                let skippedDupCount = 0;
                allImported = allImported.filter(imp => {
                    const isDup = records.some(r =>
                        String(r.unit || '').trim() === String(imp.unit || '').trim() &&
                        r.date?.substring(0, 7) === imp.date?.substring(0, 7) &&
                        r.auditName === imp.auditName &&
                        String(r.target).trim() === String(imp.target).trim()
                    );
                    if (isDup) { skippedDupCount++; return false; }
                    return true;
                });

                if (allImported.length > 0) {
                    if (session) {

                            // 分批上傳，避免 Payload 過大
                            const batchSize = 100;
                            for (let i = 0; i < allImported.length; i += batchSize) {

                                const res = await fetch(`${supabaseUrl}/rest/v1/audit_records`, {
