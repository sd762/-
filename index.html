<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清福技術考稽核系統</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

        tailwind.config = {

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root">
        <div class="flex flex-col items-center justify-center min-h-screen text-slate-400">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mb-4"></div>
            系統載入中，請稍候...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- SVG 圖示組件 ---
        const IconForm = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>;
        const IconHistory = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M12 7v5l4 2" /></svg>;
        const IconChart = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18" /><rect width="4" height="7" x="7" y="14" rx="1" /><rect width="4" height="12" x="15" y="9" rx="1" /></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>;
        const IconImport = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 5 17 10" /><line x1="12" y1="5" x2="12" y2="17" /></svg>;
        const IconManual = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>;
        const IconEyeOff = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>;
        const IconChevronDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const IconFolder = ({ color = "text-blue-500" }) => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" className={color} stroke="none"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" /></svg>;
        const IconAdmin = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>;

        const EMAIL_TO_UNIT_MAP = {
            'hok6@hok2.com.tw': '清山養老院', 'hok3@hok2.com.tw': '清心養老院', 'hok7@hok1.com.tw': '清日養老院',
            'hok11@hok3.com.tw': '清水養老院', 'hok4@hok2.com.tw': '清平養老院', 'hok8@hok1.com.tw': '清安養老院',
            'hok5@hok2.com.tw': '清春養老院', 'hok9@hok3.com.tw': '清泉養老院', 'hok15@hok6.com.tw': '清風養老院',
            'hok2@hok2.com.tw': '清氣養老院', 'hok13@hok6.com.tw': '清涼養老院', 'hok12@hok6.com.tw': '清清養老院',
            'hok14@hok6.com.tw': '清景養老院', 'hok10@hok3.com.tw': '清照養老院', 'hok16@hok6.com.tw': '清福一館',
            'hok17@hok6.com.tw': '清福二館', 'hok18@hok6.com.tw': '清福三館', 'hok1@hok2.com.tw': '清福養老院',
            'hok2f@hok6.com.tw': '清福護理之家'
        };

        const ALL_UNITS = [
            '生福課',
            '清福一館', '清福二館', '清福三館',
            '清福養老院', '清春養老院', '清山養老院', '清氣養老院', '清日養老院', '清泉養老院', '清心養老院', '清照養老院', '清水養老院', '清平養老院', '清風養老院', '清清養老院', '清安養老院', '清景養老院', '清涼養老院',
            '清福護理之家'
        ];

        // --- 本地儲存管理 ---
        const Storage = {
            saveRecords: (data) => localStorage.setItem('audit_records_v1', JSON.stringify(data)),
            getRecords: () => JSON.parse(localStorage.getItem('audit_records_v1') || '[]'),
            saveTemplates: (data) => localStorage.setItem('audit_templates_v3', JSON.stringify(data)),
            getTemplates: () => {
                let tpls = localStorage.getItem('audit_templates_v3');
                if (!tpls) tpls = localStorage.getItem('audit_templates_v2');
                return JSON.parse(tpls || '[]');
            },
            saveSettings: (data) => localStorage.setItem('audit_settings_v1', JSON.stringify(data)),
            getSettings: () => JSON.parse(localStorage.getItem('audit_settings_v1') || '{}'),
            savePersonnel: (data) => localStorage.setItem('audit_personnel_v1', JSON.stringify(data)),
            getPersonnel: () => JSON.parse(localStorage.getItem('audit_personnel_v1') || '{}')
        };

        // --- Supabase 初始化 ---
        const supabaseUrl = 'https://khkvqkbssngclojtxkuv.supabase.co';
        const supabaseKey = 'sb_publishable_iS5FgylfUr-SHIRv2XEQng_JVdEga67';
        // 使用 supabase.createClient 而非 window.supabase.createClient 並改名避免衝突
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // --- 登入組件 ---
        const Login = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [resetMode, setResetMode] = useState(false);
            const [resetMsg, setResetMsg] = useState('');
            const [resetLoading, setResetLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) setError('登入失敗，請檢查電子郵件與密碼');
                setLoading(false);
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                if (!email) { setResetMsg('請先輸入您的電子郵件地址'); return; }
                setResetLoading(true);
                setResetMsg('');
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.href
                });
                if (error) setResetMsg('發送失敗：' + error.message);
                else setResetMsg('✅ 密碼重設郵件已發送！請檢查您的信箱（1分鐘內），點擊郵件中的連結即可重設密碼。');
                setResetLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50">
                    <div className="bg-white p-8 rounded-3xl shadow-lg w-full max-w-md border border-slate-100">
                        <div className="text-center mb-8">
                            <h1 className="text-2xl font-black text-slate-800 mb-2">清福技術考稽核系統</h1>
                            <p className="text-slate-500 text-sm">{resetMode ? '輸入您的註冊郵件，系統將發送密碼重設連結' : '請登入以繼續操作'}</p>
                        </div>

                        {!resetMode ? (
                            <>
                                {error && <div className="bg-red-50 text-red-500 p-3 rounded-lg text-sm mb-4 font-bold">{error}</div>}
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">電子郵件 (Email)</label>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)} required
                                            className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                            placeholder="your@email.com" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">密碼 (Password)</label>
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} required
                                            className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                            placeholder="••••••••" />
                                    </div>
                                    <button type="submit" disabled={loading}
                                        className="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl transition-all disabled:opacity-50">
                                        {loading ? '登入中...' : '登入系統'}
                                    </button>
                                </form>
                                <div className="mt-5 text-center">
                                    <button onClick={() => { setResetMode(true); setError(null); setResetMsg(''); }}
                                        className="text-sm text-blue-500 hover:text-blue-700 hover:underline transition-colors">
                                        忘記密碼？點擊重設
                                    </button>
                                </div>
                            </>
                        ) : (
                            <>
                                {resetMsg && <div className={`p-3 rounded-lg text-sm mb-4 font-bold leading-relaxed ${resetMsg.startsWith('✅') ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-500'}`}>{resetMsg}</div>}
                                <form onSubmit={handleResetPassword} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">註冊電子郵件</label>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)} required
                                            className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary transition-all"
                                            placeholder="your@email.com" />
                                    </div>
                                    <button type="submit" disabled={resetLoading}
                                        className="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl transition-all disabled:opacity-50">
                                        {resetLoading ? '發送中...' : '發送密碼重設郵件'}
                                    </button>
                                </form>
                                <div className="mt-5 text-center">
                                    <button onClick={() => { setResetMode(false); setResetMsg(''); }}
                                        className="text-sm text-slate-500 hover:text-slate-700 hover:underline transition-colors">
                                        ← 返回登入
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // --- 系統後台組件 ---
        const AdminPanel = ({ handleTemplateUpload, handleExportBackup, handleImportBackup }) => {
            const [serviceKey, setServiceKey] = useState('');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [adminClient, setAdminClient] = useState(null);
            const [users, setUsers] = useState([]);
            const [loadingUsers, setLoadingUsers] = useState(false);
            const [error, setError] = useState(null);
            
            const [newEmail, setNewEmail] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [newUnit, setNewUnit] = useState('');
            const [creating, setCreating] = useState(false);

            // Modal for editing unit name
            const [editUnitModal, setEditUnitModal] = useState({ open: false, userId: null, userEmail: '', value: '' });

            const handleUnlock = async (e) => {
                e.preventDefault();
                setError(null);
                setLoadingUsers(true);
                
                try {
                    if (!serviceKey || serviceKey.length < 20) {
                        throw new Error("請輸入有效的 Service Role Key");
                    }

                    // 直接使用 fetch 測試金鑰是否有效 (獲取用戶列表)
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users`, {
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`
                        }
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.msg || errData.error || "金鑰驗證失敗");
                    }
                    
                    const data = await response.json();
                    setUsers(data.users || []);
                    setIsAdminAuth(true);
                } catch (err) {
                    console.error("handleUnlock error:", err);
                    setError('驗證失敗：' + err.message);
                } finally {
                    setLoadingUsers(false);
                }
            };

            const fetchUsers = async () => {
                setLoadingUsers(true);
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users`, {
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`
                        }
                    });
                    const data = await response.json();
                    if (data.users) setUsers(data.users);
                } catch (err) {
                    setError('更新列表失敗');
                }
                setLoadingUsers(false);
            };

            const handleCreateUser = async (e) => {
                e.preventDefault();
                setCreating(true);
                setError(null);
                
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users`, {
                        method: 'POST',
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: newEmail,
                            password: newPassword,
                            email_confirm: true,
                            user_metadata: { unit: newUnit, role: 'user' }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.msg || data.error || "建立失敗");

                    setNewEmail('');
                    setNewPassword('');
                    setNewUnit('');
                    fetchUsers();
                } catch (err) {
                    setError('建立失敗：' + err.message);
                }
                setCreating(false);
            };

            const handleDeleteUser = async (userId) => {
                if (!window.confirm('確定要永久刪除此帳號嗎？')) return;
                setError(null);
                
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users/${userId}`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`
                        }
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.msg || data.error || "刪除失敗");
                    }
                    fetchUsers();
                } catch (err) {
                    setError('刪除失敗：' + err.message);
                }
            };

            const openEditUnitModal = (userId, userEmail, currentUnit) => {
                setEditUnitModal({ open: true, userId, userEmail, value: currentUnit || '' });
            };

            const handleEditUnitSave = async () => {
                const { userId, value } = editUnitModal;
                const user = users.find(u => u.id === userId);
                const currentMetadata = user?.user_metadata || {};

                setLoadingUsers(true);
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users/${userId}`, {
                        method: 'PUT',
                        headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_metadata: { ...currentMetadata, unit: value.trim() } })
                    });
                    if (!response.ok) throw new Error('更新失敗');
                    setEditUnitModal({ open: false, userId: null, userEmail: '', value: '' });
                    fetchUsers();
                } catch (err) {
                    setError('修改失敗：' + err.message);
                } finally {
                    setLoadingUsers(false);
                }
            };

            const handleResetPassword = async (userId, userEmail) => {
                const newPwd = prompt(`請輸入 ${userEmail} 的新密碼 (至少6碼)：`);
                if (!newPwd || newPwd.length < 6) {
                    if (newPwd !== null) alert("密碼無效或長度不足6碼");
                    return;
                }
                setError(null);
                try {
                    const response = await fetch(`${supabaseUrl}/auth/v1/admin/users/${userId}`, {
                        method: 'PUT',
                        headers: {
                            'apikey': serviceKey,
                            'Authorization': `Bearer ${serviceKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ password: newPwd })
                    });
                    
                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.msg || data.error || "重置密碼失敗");
                    }
                    alert("密碼重置成功！");
                } catch (err) {
                    setError('重置密碼失敗：' + err.message);
                }
            };

            const handleFixUnits = async () => {
                if (!window.confirm('確定要根據預設名單自動修正所有帳號的所屬機構嗎？\n這將會補齊已建立但缺乏機構資訊的帳號。')) return;
                setLoadingUsers(true);
                let count = 0;
                try {
                    for (let u of users) {
                        const mappedUnit = EMAIL_TO_UNIT_MAP[u.email.toLowerCase()];
                        if (mappedUnit && (!u.user_metadata || u.user_metadata.unit !== mappedUnit)) {
                            await fetch(`${supabaseUrl}/auth/v1/admin/users/${u.id}`, {
                                method: 'PUT',
                                headers: { 'apikey': serviceKey, 'Authorization': `Bearer ${serviceKey}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ user_metadata: { ...u.user_metadata, unit: mappedUnit } })
                            });
                            count++;
                        }
                    }
                    alert(`修正完成！共更新 ${count} 個帳號。`);
                    fetchUsers();
                } catch (err) {
                    setError('修正過程中發生錯誤：' + err.message);
                } finally {
                    setLoadingUsers(false);
                }
            };

            const [syncStatus, setSyncStatus] = useState({ loading: false, message: '' });

            const handleSyncToCloud = async () => {

                                'Authorization': `Bearer ${serviceKey}`,

                                sub_category: t.subCategory,
                                target_staff: t.targetStaff,
                                responsible: t.responsible,
                                frequency: t.frequency,
                                schedule: t.schedule,
                                threshold: t.threshold,

                                technique: r.technique,

        const normalizeDate = (val) => {
            if (!val) return '';
            const strVal = String(val).trim();
            if (/^\d{8}$/.test(strVal)) {
                return `${strVal.substring(0, 4)}-${strVal.substring(4, 6)}-${strVal.substring(6, 8)}`;
            }
            if (/^\d{7}$/.test(strVal)) {
                return `${Number(strVal.substring(0, 3)) + 1911}-${strVal.substring(3, 5)}-${strVal.substring(5, 7)}`;
            }
            if (!isNaN(val) && Number(val) > 20000 && Number(val) < 100000) {
                const date = new Date(Math.round((Number(val) - 25569) * 86400 * 1000));
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }
            if (/^\d{4}-\d{2}-\d{2}$/.test(strVal)) return strVal;
            let str = strVal.replace(/[\/\.]/g, '-');
            const parts = str.split('-');
            if (parts.length === 3) {
                let [y, m, d] = parts;
                if (Number(y) < 1000) y = String(Number(y) + 1911);
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return strVal;
        };

            const buildTableData = useCallback((categoryName) => {
                const hiddenItems = reportSettings.hiddenItems || [];
                const manualScores = reportSettings.manualScores || {};
                const analysisTexts = reportSettings.analysisTexts || {};
                const customFreqs = reportSettings.customFrequencies || {};

                const allItems = templates.filter(t => t.mainCategory === categoryName).map(tpl => {
                    const yearRecords = records.filter(r => {
                        const uCat = r.unitCategory || getUnitCategory(r.unit);
                        return String(r.date).startsWith(selectedYear) &&
                            r.auditName.includes(tpl.name) &&
                            (filterUnit ? (String(r.unit || '').trim().includes(String(filterUnit || '').trim()) || String(filterUnit || '').trim().includes(String(r.unit || '').trim())) : (filterUnitCategory ? uCat === filterUnitCategory : true));
                    });
                    const mAvgs = Array(13).fill(null).map(() => ({ val: '', count: 0, manual: false }));
                    let sum = 0, sum2 = 0, count = 0;
                    if (tpl.isDual) {
                        const monthsC = Array(13).fill(0), monthsA = Array(13).fill(0), monthsCnt = Array(13).fill(0);
                        yearRecords.forEach(r => {
                            const m = parseInt(r.date.split('-')[1]);
                            if (m) { monthsC[m] += Number(r.score || 0); monthsA[m] += Number(r.score2 || 0); monthsCnt[m]++; }
                        });
                        for (let m = 1; m <= 12; m++) {
                            const key = `${selectedYear}_${tpl.id}_${m}`;
                            if (manualScores[key]) {
                                mAvgs[m] = { val: manualScores[key], count: 0, manual: true };
                                const p = manualScores[key].split('/');
                                if (p[1]) { sum += Number(p[0]); sum2 += Number(p[1]); count++; }
                            }
                            else if (monthsCnt[m] > 0) {
                                const c = Math.round(monthsC[m] / monthsCnt[m]), a = Math.round(monthsA[m] / monthsCnt[m]);
                                mAvgs[m] = { val: `${c}/${a}`, count: monthsCnt[m], manual: false };
                                sum += c;
                                sum2 += a;
                                count++;
                            }
                        }
                    } else {
                        const monthsS = Array(13).fill(0), monthsCnt = Array(13).fill(0);
                        yearRecords.forEach(r => { const m = parseInt(r.date.split('-')[1]); if (m) { monthsS[m] += Number(r.score); monthsCnt[m]++; } });
                        for (let m = 1; m <= 12; m++) {
                            const key = `${selectedYear}_${tpl.id}_${m}`;
                            if (manualScores[key]) { const v = Number(manualScores[key]); mAvgs[m] = { val: v, count: 0, manual: true }; sum += v; count++; }
                            else if (monthsCnt[m] > 0) { const v = Math.round(monthsS[m] / monthsCnt[m]); mAvgs[m] = { val: v, count: monthsCnt[m], manual: false }; sum += v; count++; }
                        }
                    }
                    const avgStr = count > 0 ? (tpl.isDual ? `${Math.round(sum / count)}/${Math.round(sum2 / count)}` : Math.round(sum / count)) : '-';
                    const customThresholds = reportSettings.customThresholds || {};
                    const itemThreshold = customThresholds[tpl.id] !== undefined ? Number(customThresholds[tpl.id]) : (tpl.threshold || 90);

                    // 自動產出分析文字
                    const generateAutoAnalysis = () => {
                        if (count === 0) return '';
                        const itemName = tpl.name;
                        let text = '';

                        if (tpl.isDual) {
                            const avgComp = Math.round(sum / count);
                            const avgAcc = Math.round(sum2 / count);
                            const belowMonths = [];
                            for (let m = 1; m <= 12; m++) {
                                if (mAvgs[m].val !== '') {
                                    const parts = String(mAvgs[m].val).split('/');
                                    if (parts.length === 2 && (Number(parts[0]) < itemThreshold || Number(parts[1]) < itemThreshold)) {
                                        belowMonths.push({ month: m, comp: Number(parts[0]), acc: Number(parts[1]) });
                                    }
                                }
                            }
                            if (avgComp >= itemThreshold && avgAcc >= itemThreshold && belowMonths.length === 0) {
                                text = `${itemName}年度平均遵從率${avgComp}%、正確率${avgAcc}%，均達閾值${itemThreshold}%以上。建議持續維持現有監測機制。`;
                            } else {
                                text = `${itemName}年度平均遵從率${avgComp}%、正確率${avgAcc}%(閾值${itemThreshold}%)。`;
                                if (belowMonths.length > 0) {
                                    text += `未達標月份：${belowMonths.map(b => `${b.month}月(${b.comp}/${b.acc})`).join('、')}。`;
                                }
                                if (avgComp < itemThreshold) text += '遵從率不足，建議加強洗手時機宣導。';
                                if (avgAcc < itemThreshold) text += '正確率偏低，需加強洗手步驟訓練。';
                            }
                        } else {
                            const avgScore = Math.round(sum / count);
                            const belowMonths = [];
                            const scoreValues = [];
                            for (let m = 1; m <= 12; m++) {
                                if (mAvgs[m].val !== '') {
                                    const v = Number(mAvgs[m].val);
                                    scoreValues.push({ month: m, val: v });
                                    if (v < itemThreshold) belowMonths.push({ month: m, val: v });
                                }
                            }
                            // 趨勢分析 (2筆以上才比較趨勢)
                            let trend = '';
                            if (scoreValues.length >= 2) {
                                const firstHalf = scoreValues.slice(0, Math.floor(scoreValues.length / 2));
                                const secondHalf = scoreValues.slice(Math.floor(scoreValues.length / 2));
                                const firstAvg = firstHalf.reduce((a, c) => a + c.val, 0) / firstHalf.length;
                                const secondAvg = secondHalf.reduce((a, c) => a + c.val, 0) / secondHalf.length;
                                if (secondAvg - firstAvg >= 5) trend = '呈上升趨勢';
                                else if (firstAvg - secondAvg >= 5) trend = '呈下降趨勢，需注意';
                                else trend = '表現穩定';
                            }

                            // 單次測驗 vs 多次測驗 用不同措辭
                            const isSingle = scoreValues.length === 1;

                            if (avgScore >= itemThreshold && belowMonths.length === 0) {
                                if (isSingle) {
                                    text = `${itemName}本年度${scoreValues[0].month}月測驗成績${avgScore}%，達標(閾值${itemThreshold}%)。建議持續維持現有考核標準。`;
                                } else {
                                    text = `${itemName}年度平均${avgScore}%，全年達標(閾值${itemThreshold}%)。`;
                                    if (trend) text += `整體${trend}。`;
                                    text += '建議持續維持現有考核標準與監測頻率。';
                                }
                            } else if (avgScore >= itemThreshold && belowMonths.length > 0) {
                                text = `${itemName}年度平均${avgScore}%達標，但${belowMonths.map(b => `${b.month}月(${b.val}%)`).join('、')}低於閾值${itemThreshold}%。`;
                                if (trend) text += `整體${trend}。`;
                                text += '建議針對未達標月份檢討原因，加強人員複訓。';
                            } else {
                                if (isSingle) {
                                    text = `⚠ ${itemName}本年度${scoreValues[0].month}月測驗成績${avgScore}%，未達閾值${itemThreshold}%。`;
                                } else {
                                    text = `⚠ ${itemName}年度平均${avgScore}%，未達閾值${itemThreshold}%。`;
                                    if (belowMonths.length > 0) {
                                        text += `未達標月份：${belowMonths.map(b => `${b.month}月(${b.val}%)`).join('、')}。`;
                                    }
                                    if (trend) text += `整體${trend}。`;
                                }
                                text += '建議：1.安排全員複訓 2.增加稽核頻率 3.檢討操作流程並落實改善。';
                            }
                        }
                        return text;
                    };

                    return { id: tpl.id, itemName: tpl.name, targetStaff: tpl.targetStaff || '-', responsible: tpl.responsible || '-', frequency: customFreqs[tpl.id] || tpl.frequency, schedule: tpl.schedule || [], threshold: itemThreshold, isDual: !!tpl.isDual, mAvgs, avg: avgStr, analysisText: analysisTexts[`${selectedYear}_${tpl.id}`] || '', autoAnalysisText: generateAutoAnalysis(), isHidden: hiddenItems.includes(tpl.id) };
                });
                return { visible: allItems.filter(i => !i.isHidden), hidden: allItems.filter(i => i.isHidden) };
            }, [records, selectedYear, templates, reportSettings, filterUnitCategory, filterUnit]);

            const careReportData = useMemo(() => buildTableData('照護品質類技術考'), [buildTableData]);
            const equipReportData = useMemo(() => buildTableData('儀器操作類技術考'), [buildTableData]);

            // === 恢復遺失的變數與函數 ===
            const flatFilteredRecords = useMemo(() => {
                return records.filter(r => {
                    const uCat = r.unitCategory || getUnitCategory(r.unit);
                    const normalize = (s) => String(s || '').replace(/[^\u4e00-\u9fa5]/g, '');
                    const rUnitNorm = normalize(r.unit);
                    const fUnitNorm = normalize(filterUnit);
                    return (filterMonth ? String(r.date).startsWith(filterMonth) : true) &&
                        (filterItem ? r.auditName === filterItem : true) &&
                        (filterUnit ? (rUnitNorm.includes(fUnitNorm) || fUnitNorm.includes(rUnitNorm)) : (filterUnitCategory ? uCat === filterUnitCategory : true));
                });
            }, [records, filterMonth, filterItem, filterUnitCategory, filterUnit]);

            const groupedRecords = useMemo(() => {
                const groups = {};
                flatFilteredRecords.forEach(r => {
                    const u = r.unit || '未指派單位';
                    const m = String(r.date).substring(0, 7) || '未知';
                    const it = r.auditName;

                    if (!groups[u]) groups[u] = { months: {}, totalCount: 0 };
                    if (!groups[u].months[m]) groups[u].months[m] = { items: {}, totalCount: 0 };
                    if (!groups[u].months[m].items[it]) groups[u].months[m].items[it] = [];

                    groups[u].months[m].items[it].push(r);
                    groups[u].months[m].totalCount++;
                    groups[u].totalCount++;
                });
                return Object.keys(groups).sort().reduce((acc, uKey) => {
                    const unitData = groups[uKey];
                    unitData.months = Object.keys(unitData.months).sort().reverse().reduce((mAcc, mKey) => {
                        mAcc[mKey] = unitData.months[mKey]; return mAcc;
                    }, {});
                    acc[uKey] = unitData;
                    return acc;
                }, {});
            }, [flatFilteredRecords]);

            const uniqueMonths = useMemo(() => [...new Set(records.map(r => String(r.date).substring(0, 7)))].sort().reverse(), [records]);
            const uniqueItems = useMemo(() => [...new Set(records.map(r => r.auditName))].sort(), [records]);

            const toggleFolder = (folderId) => {

            const handleToggleSelect = (id) => {

                setSelectedIds(newIds);

                const newIds = new Set();
                if (e.target.checked) flatFilteredRecords.forEach(r => newIds.add(r.id));
                setSelectedIds(newIds);
            };

            const handleToggleFolderSelect = (e, recsToToggle) => {
                e.stopPropagation();
                const isAllSelected = recsToToggle.every(r => selectedIds.has(r.id));
                const newIds = new Set(selectedIds);
                if (isAllSelected) recsToToggle.forEach(r => newIds.delete(r.id));
                else recsToToggle.forEach(r => newIds.add(r.id));

            const handleBatchDelete = async () => {
                if (selectedIds.size === 0) return showAlert('請先勾選資料！');
                showConfirm(`確定要刪除選取的 ${selectedIds.size} 筆資料？`, async () => {

                    // 如果已登入，同步刪除雲端資料

                    setRecords(prev => prev.filter(r => !selectedIds.has(r.id)));
                    setSelectedIds(new Set());

            const handleDeleteSingle = async (id) => {

            };

            const handleExportChartExcel = () => {
                const borderStyle = { style: "thin", color: { rgb: "000000" } };
                const applyGlobalStyle = (ws) => {
                    for (let c in ws) {
                        if (c[0] === '!') continue;

                    }
                };
                const addReviewerRow = (ws, sheetData) => {

                    ws[cell] = { v: '覆核者:機構主任(業務負責人):', s: { alignment: { horizontal: "left", vertical: "center" }, font: { bold: true } } };
                    range.e.r = newRow;
                    ws['!ref'] = window.XLSX.utils.encode_range(range);
                };
                const formatData = (data) => data.visible.map(row => {
                    const out = { '品管項目': row.itemName, '被稽核人員': row.targetStaff, '負責人': row.responsible, '監測頻率': row.frequency, '閾值(%)': row.threshold };
                    for (let m = 1; m <= 12; m++) out[`${m}月`] = row.mAvgs[m]?.val !== undefined ? row.mAvgs[m].val : '';
                    out['年平均'] = row.avg !== '-' ? row.avg : '';

                    return out;
                });
                const wb = window.XLSX.utils.book_new();

                window.XLSX.writeFile(wb, `${selectedYear}年度_稽核分析總表.xlsx`);
            };
            // =============================

            const showAlert = (message, title = '系統提示') => setDialog({ isOpen: true, type: 'alert', title, message, onConfirm: null, onCancel: null });
            const showConfirm = (message, onConfirm, title = '⚠️ 確認操作', onCancel = null) => setDialog({ isOpen: true, type: 'confirm', title, message, onConfirm, onCancel });

            const getUniqueName = (unitData, baseName) => {

            };

            const handleManualScoreChange = (tplId, month, value, isDual) => {

                setReportSettings(p => {
                    const n = { ...(p.manualScores || {}) };

            const handleFrequencyChange = (tplId, value) => {

            const handleThresholdChange = (tplId, value) => {

            const handleClearAnalysis = (tplId) => {

                setReportSettings(p => {

                    delete n[key];
                    return { ...p, analysisTexts: n };

            const handleHideItem = (tplId) => setReportSettings(p => ({ ...p, hiddenItems: [...(p.hiddenItems || []), tplId] }));
            const handleRestoreItem = (tplId) => setReportSettings(p => ({ ...p, hiddenItems: (p.hiddenItems || []).filter(id => id !== tplId) }));

            const handleTplFilterChange = (type, value) => {

                if (type === 'sub') setFilterTplSubCat(value);
                setCurrentTemplateId(''); setChecklist([]);
                setFormData(p => ({ ...p, auditName: '一般綜合稽核', score: '', score2: '', isDual: false, technique: '' }));

            const availableTemplates = useMemo(() => templates.filter(t => (filterTplMainCat ? t.mainCategory === filterTplMainCat : true) && (filterTplSubCat ? t.subCategory === filterTplSubCat : true)), [templates, filterTplMainCat, filterTplSubCat]);

            const handleDualScoreChange = (idx, field, value) => {
                const nl = [...checklist]; nl[idx][field] = value;
                if (field === 'comp' && value === 'none') nl[idx].acc = null;
                setChecklist(nl);
            };

            const handleExportExcel = () => {
                let targets = selectedIds.size > 0 ? records.filter(r => selectedIds.has(r.id)) : flatFilteredRecords;
                if (targets.length === 0) return showAlert('沒有資料可匯出！');

                const borderStyle = { style: "thin", color: { rgb: "000000" } };
                const applyGlobalStyle = (ws) => {
                    for (let c in ws) {
                        if (c[0] === '!') continue;
                        if (ws[c]) ws[c].s = { alignment: { horizontal: "center", vertical: "center", wrapText: true }, border: { top: borderStyle, bottom: borderStyle, left: borderStyle, right: borderStyle } };
                    }
                };
                const addReviewerRow = (ws) => {
                    const range = window.XLSX.utils.decode_range(ws['!ref']);

                    const cell = window.XLSX.utils.encode_cell({ r: newRow, c: 0 });
                    ws[cell] = { v: '覆核者:機構主任(業務負責人):', s: { alignment: { horizontal: "left", vertical: "center" }, font: { bold: true } } };
                    range.e.r = newRow;
                    ws['!ref'] = window.XLSX.utils.encode_range(range);
                };

                // 分離洗手遵從性資料與其他考核資料
                const handHygieneTargets = targets.filter(r => r.auditName.includes('洗手遵從性及正確性'));
                const otherTargets = targets.filter(r => !r.auditName.includes('洗手遵從性及正確性'));

                const wb = window.XLSX.utils.book_new();

                // === 洗手遵從性及正確性：始終產出稽核明細 + 統計報表 ===
                if (handHygieneTargets.length > 0) {
                    let monthStr = filterMonth ? filterMonth.replace('-', '年 ') + '月' : '全部月份';
                    const unitName = handHygieneTargets[0]?.unit || '新北市私立清福護理之家';

                    // --- Format 1: 稽核明細表 (Detailed Checklist) ---
                    const detailWsData = [];
                    detailWsData.push([unitName]);
                    detailWsData.push(['洗手遵從性及正確性稽核表']);
                    detailWsData.push(['稽核員：（感控專責人員）']);
                    const r3 = [], r4 = [], r5 = [], r6 = [];
                    handHygieneTargets.forEach((r, idx) => {
                        r3.push(idx === 0 ? '受稽人' : '受稽人員：', r.target, '');
                        let twDate = r.date;

                        let technique = r.auditName.split('(')[1]?.replace(')', '') || '(其他)';
                        r5.push(`項目：${technique}`, '', '');

                    });
                    detailWsData.push(r3, r4, r5, r6);

                    let maxLen = 0;
                    handHygieneTargets.forEach(r => { if (r.checklist.length > maxLen) maxLen = r.checklist.length; });

                    for (let i = 0; i < maxLen; i++) {
                        const row = [];
                        handHygieneTargets.forEach(r => {
                            if (i < r.checklist.length) {

                                if (stepStr) displayStr += `\n洗手步驟\n${stepStr}`;

                                let tName = item.name.replace('時機一：', '1').replace('時機二：', '2').replace('時機三：', '3').replace('時機四：', '4').replace('時機五：', '5');
                                row.push(i + 1, tName, displayStr);
                            } else {
                                row.push('', '', '');
                            }
                        });
                        detailWsData.push(row);
                    }

                    const detailWs = window.XLSX.utils.aoa_to_sheet(detailWsData);
                    applyGlobalStyle(detailWs);
                    detailWs['!cols'] = Array(handHygieneTargets.length * 3).fill({ wch: 9 });
                    detailWs['!rows'] = [];
                    for (let rIdx = 6; rIdx < detailWsData.length; rIdx++) {
                        detailWs['!rows'][rIdx] = { hpt: 100 };
                    }
                    const merges1 = [

                                    else if (cleanRaw.includes('抽痰技術') || cleanRaw.includes('抽痰')) finalAuditName = '抽痰技術評核表';
                                    else if (cleanRaw.includes('傷口評估') || cleanRaw.includes('換藥')) finalAuditName = '傷口評估換藥護理評核表';
                                    else if (cleanRaw.includes('氣切造口') || cleanRaw.includes('氣切')) finalAuditName = '氣切造口護理技術評核表';
                                    else if (cleanRaw.includes('造口護理')) finalAuditName = '造口護理技術評核表';

                                    else if (cleanRaw.includes('昏迷指數') || cleanRaw.includes('GCS')) finalAuditName = '昏迷指數(GCS)評核表';

                                    else if (cleanRaw.includes('上下床輪椅') || cleanRaw.includes('上下床') || cleanRaw.includes('輪椅')) finalAuditName = '上下床輪椅使用評核';

                                    else {

                                        }

                                    isDual: isDualItem, notes: String(row['總結建議'] || ''), checklist: checklist

                            });

                                    </div>
                                    {pwdError && <p className="text-red-500 text-xs font-bold">{pwdError}</p>}
                                    {pwdMsg && <p className="text-emerald-600 text-xs font-bold">{pwdMsg}</p>}
                                    <div className="flex gap-2 justify-end mt-2">
                                        <button onClick={() => { setShowPwdModal(false); setNewPwd(''); setConfirmPwd(''); setPwdError(''); setPwdMsg(''); }} className="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-200 transition-colors">取消</button>
                                        <button onClick={async () => {
                                            if (newPwd.length < 6) { setPwdError('密碼長度至少需要 6 碼'); return; }
                                            if (newPwd !== confirmPwd) { setPwdError('兩次密碼不一致，請重新輸入'); return; }
                                            setPwdError(''); setPwdMsg('');
                                            const { error } = await supabaseClient.auth.updateUser({ password: newPwd });
                                            if (error) setPwdError('密碼變更失敗: ' + error.message);
                                            else {
                                                setPwdMsg('✅ 密碼變更成功！即將關閉...');
                                                setTimeout(() => { setShowPwdModal(false); setNewPwd(''); setConfirmPwd(''); setPwdMsg(''); }, 1500);
                                            }
                                        }} disabled={!newPwd || !confirmPwd || newPwd !== confirmPwd || newPwd.length < 6} className="px-5 py-2.5 bg-primary text-white rounded-xl text-sm font-bold shadow hover:bg-blue-700 transition-colors disabled:opacity-40">確認變更</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {dialog.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[9999] p-4 animate-fade-in">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full">
                                <h3 className="font-bold text-lg mb-3">{dialog.title}</h3>
                                <p className="text-slate-600 mb-6 text-sm whitespace-pre-line">{dialog.message}</p>
                                <div className="flex justify-end gap-3">
                                    {dialog.type === 'confirm' && <button onClick={() => { if (dialog.onCancel) dialog.onCancel(); setDialog({ ...dialog, isOpen: false }); }} className="px-5 py-2 bg-slate-100 rounded-xl font-bold text-sm">取消</button>}
                                    <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false }); }} className={`px-5 py-2 rounded-xl font-bold text-sm text-white ${dialog.type === 'confirm' ? 'bg-red-600' : 'bg-primary'}`}>{dialog.type === 'confirm' ? '確定' : '了解'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <div style={{fontSize:"10px", color:"#999", padding:"10px", textAlign:"center", borderTop:"1px dashed #eee"}}>{debugInfo || "\u6b63\u5728\u8f09\u5165\u96f2\u7aef\u8a3a\u65b7\u8cc7\u8a0a..."}</div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
